# =============================================================================
# FILE: pytest.ini
# DESCRIPTION: Central pytest configuration for PlaidBridgeOpenBankingApi
# =============================================================================

[pytest]
addopts = -ra -q --disable-warnings --maxfail=1 --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=30
plugins = app.tests.pytest_plugins
testpaths = app/tests
python_files = test_*.py *_test.py
norecursedirs = app/cli backup venv .git .pytest_cache azure-functions-core-tools

env =
    FLASK_ENV=testing

markers =
    migrations
    google
    microsoft
    plaid
    ci
    nightly
    smoketest
    auth
    migration_backed
    redis
    providers
    infra














