# =============================================================================
# FILE: pytest.ini
# DESCRIPTION: Central pytest configuration for PlaidBridgeOpenBankingApi
# =============================================================================

[pytest]
pythonpath = .
addopts = -ra -q --maxfail=1 --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=30
testpaths = app/tests
python_files = test_*.py *_test.py
norecursedirs = .* build dist *.egg venv app/cli backup

env =
    FLASK_ENV=testing
    TESTING=True
    PYTEST=True
    RATE_LIMIT_ENABLED=False

filterwarnings =
    ignore::pytest.PytestConfigWarning
    ignore::UserWarning
    ignore::sqlalchemy.exc.SAWarning

markers =
    migrations
    google
    microsoft
    plaid
    ci
    nightly
    smoketest
    auth
    migration_backed
    redis
    providers
    infra