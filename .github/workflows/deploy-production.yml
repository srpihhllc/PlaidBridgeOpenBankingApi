name: Production Deployment Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  e2e-sync-tests:
    name: E2E Sync Smoke Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PYTHONPATH: ${{ github.workspace }}/PlaidBridgeOpenBankingApi:${{ github.workspace }}
      DATABASE_URL: mysql+pymysql://test:test@127.0.0.1:3306/test_db
      REDIS_URL: redis://127.0.0.1:6379/0
      FLASK_CONFIG: testing
      ALEMBIC_RUNNING: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pymysql requests

      - name: Run E2E Sync Harness
        run: |
          test -f tests/e2e/test_sync_harness.py || (echo "E2E harness script missing!" && exit 1)
          python -m pytest -q tests/e2e/test_sync_harness.py

  deploy-pythonanywhere:
    name: Deploy to PythonAnywhere Host
    needs: e2e-sync-tests
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PA_SSH_KEY }}

      - name: Execute Remote Deployment Steps
        env:
          DEPLOY_REF: ${{ github.ref_name }}
          PA_USER: ${{ secrets.PA_USER }}
          PA_HOST_KEY: ${{ secrets.PA_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$PA_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Base64 encode both ref and user to safely transport them through SSH shell boundaries
          ENCODED_REF=$(echo -n "$DEPLOY_REF" | base64 | tr -d '\n')
          ENCODED_USER=$(echo -n "$PA_USER" | base64 | tr -d '\n')

          ssh "$PA_USER@ssh.pythonanywhere.com" bash -s -- "$ENCODED_REF" "$ENCODED_USER" <<'REMOTE'
            set -euo pipefail
            ENCODED_REF="$1"
            ENCODED_USER="$2"
            REF="$(echo "$ENCODED_REF" | base64 --decode)"
            USER_NAME="$(echo "$ENCODED_USER" | base64 --decode)"
            REMOTE_DIR=~/PlaidBridgeOpenBankingApi
            cd "$REMOTE_DIR"
            git fetch --all --tags
            git checkout --detach "$REF"
            source ~/.virtualenvs/"$USER_NAME"-python3.12/bin/activate
            pip install --no-cache-dir -r requirements.txt
            python -m alembic -c alembic.ini upgrade head
            touch /var/www/"${USER_NAME}_pythonanywhere_com_wsgi.py"
          REMOTE

  verify-deployment:
    name: Post-Deployment Health Verification
    needs: deploy-pythonanywhere
    runs-on: ubuntu-latest
    steps:
      - name: Verify Endpoint Readiness
        env:
          PA_USER: ${{ secrets.PA_USER }}
        run: |
          echo "Waiting 15s for PythonAnywhere WSGI worker reload..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${PA_USER}.pythonanywhere.com/health")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Deployment succeeded. Health endpoint returned status 200."
          else
            echo "❌ Production endpoint failed with status code: $STATUS"
            exit 1
          fi