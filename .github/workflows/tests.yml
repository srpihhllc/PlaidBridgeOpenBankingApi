name: Tests

on:
  push:
    branches: [fix/restore-dummy-test-routes]
  pull_request:
    branches: [fix/restore-dummy-test-routes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ci

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      FLASK_ENV: testing
      TESTING: "1"
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_SOCKET_TIMEOUT: "10"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      PLAID_ENV: sandbox
      PLAID_API_BASE_URL: https://sandbox.plaid.com

      # CI-only values; never use production credentials here.
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      ACH_WEBHOOK_SECRET: ${{ secrets.CI_ACH_WEBHOOK_SECRET }}
      RECONCILE_WEBHOOK_SECRET: ${{ secrets.CI_RECONCILE_WEBHOOK_SECRET }}
      PLAID_CLIENT_ID: ${{ secrets.CI_PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.CI_PLAID_SECRET }}
      POLSIA_WEBHOOK_SECRET: ${{ secrets.CI_POLSIA_WEBHOOK_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing
