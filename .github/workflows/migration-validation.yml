name: Migration Validation
on: [pull_request]
jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install -r requirements.txt
      - name: Validate migration imports and filenames
        run: |
          python - <<'PY'
import importlib.util, glob, sys, os
errs = []
for path in sorted(glob.glob("migrations/versions/*.py")):
    spec = importlib.util.spec_from_file_location(path, path)
    m = importlib.util.module_from_spec(spec)
    try:
        spec.loader.exec_module(m)
    except Exception as e:
        print("IMPORT ERROR", path, e)
        errs.append(path)
        continue
    rev = getattr(m, "revision", None)
    fname = os.path.basename(path)
    if not rev or not fname.startswith(rev):
        print("FILENAME MISMATCH", path, "declares", rev)
        errs.append(path)
if errs:
    print("Migration validation failed:", errs)
    sys.exit(1)
print("Migration validation passed.")
PY
