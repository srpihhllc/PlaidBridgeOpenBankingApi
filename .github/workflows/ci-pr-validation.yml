name: CI PR Validation

on:
  pull_request:
    branches:
      - main
      - PlaidBridgeOpenBankingApi

jobs:
  backend-integration:
    name: Backend Integration Tests & Validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PYTHONPATH: ${{ github.workspace }}/PlaidBridgeOpenBankingApi:${{ github.workspace }}
      DATABASE_URL: mysql+pymysql://test:test@127.0.0.1:3306/test_db
      REDIS_URL: redis://127.0.0.1:6379/0
      FLASK_CONFIG: testing
      ALEMBIC_RUNNING: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Repository Structure
        run: |
          set -euo pipefail
          test -d PlaidBridgeOpenBankingApi/app || (echo "Missing directory: PlaidBridgeOpenBankingApi/app" && exit 1)
          test -d PlaidBridgeOpenBankingApi/docs || (echo "Missing directory: PlaidBridgeOpenBankingApi/docs" && exit 1)
          test -f requirements.txt || (echo "Missing requirements.txt" && exit 1)
          test -f alembic.ini || (echo "Missing alembic.ini" && exit 1)
          test -f PlaidBridgeOpenBankingApi/docs/10-openapi.yaml || (echo "Missing PlaidBridgeOpenBankingApi/docs/10-openapi.yaml" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage pip-audit bandit pymysql openapi-spec-validator

      - name: Validate OpenAPI Spec
        run: python -m openapi_spec_validator PlaidBridgeOpenBankingApi/docs/10-openapi.yaml

      - name: Run Alembic migrations
        run: python -m alembic -c alembic.ini upgrade head

      - name: Run pytest
        run: python -m pytest -q -vv

      - name: Run Security Audits
        run: |
          pip-audit --progress=off
          bandit -r PlaidBridgeOpenBankingApi -x .venv -f json -o bandit-results.json