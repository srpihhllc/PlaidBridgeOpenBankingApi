name: Route Drift Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  route-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true

      - name: Run route drift check
        env:
          FLASK_APP: app:create_app
          FLASK_ENV: test
        run: |
          # Fail early if route drift detected. Adjust expected file path as necessary.
          python -m flask route-drift --expected-file expected_endpoints.json --fail-on-missing