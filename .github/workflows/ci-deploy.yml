name: CI / Prepare & Deploy

on:
  push:
    branches:
      - main
      - PlaidBridgeOpenBankingApi
      - 'fix/*'
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/PlaidBridgeOpenBankingApi:${{ github.workspace }}
      ALEMBIC_RUNNING: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Create venv and upgrade pip
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies (runtime + dev)
        run: |
          set -e
          . .venv/bin/activate
          if [ -f requirements.txt ]; then
            python -m pip install --no-cache-dir -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install --no-cache-dir -r requirements-dev.txt
          fi
          python -m pip install --no-cache-dir -q flask pytest || true

      - name: Verify installed packages
        run: |
          . .venv/bin/activate
          echo "Python: $(which python)"
          echo "Pip:    $(which pip)"
          pip list --format=columns
          python - <<'PY'
import importlib, sys
try:
    m = importlib.import_module('flask')
    print("flask import OK:", getattr(m, "__version__", "unknown"))
except Exception as e:
    print("flask import FAILED:", type(e).__name__, e)
    sys.exit(2)
PY

      - name: Run ruff (lint) — non-blocking
        run: |
          . .venv/bin/activate
          python -m pip install --no-cache-dir ruff
          ruff check app || true

      - name: Run tests (skip pytest-cov plugin)
        run: |
          . .venv/bin/activate
          python -m pytest -q -p no:pytest_cov

      - name: Run Alembic migrations (check only)
        run: |
          . .venv/bin/activate
          python -m alembic -c migrations/alembic.ini upgrade head || echo "alembic step failed or no DB access; check logs"

      # ---------------------------------------------------------
      # SSH KEY MUST BE LOADED BEFORE ANY SSH COMMANDS
      # ---------------------------------------------------------
      - name: Add SSH key
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PA_SSH_KEY }}

      # ---------------------------------------------------------
      # DEPLOY .env TO PYTHONANYWHERE
      # ---------------------------------------------------------
      - name: Deploy .env to PythonAnywhere
        if: github.ref == 'refs/heads/main'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PA_USER }}@ssh.pythonanywhere.com "
            cd PlaidBridgeOpenBankingApi &&
            echo 'SECRET_KEY=${{ secrets.SECRET_KEY }}' > .env &&
            echo 'JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}' >> .env &&
            echo 'DB_USER=${{ secrets.DB_USER }}' >> .env &&
            echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env &&
            echo 'DB_HOST=${{ secrets.DB_HOST }}' >> .env &&
            echo 'DB_NAME=${{ secrets.DB_NAME }}' >> .env &&
            echo 'PLAID_CLIENT_ID=${{ secrets.PLAID_CLIENT_ID }}' >> .env &&
            echo 'PLAID_SECRET=${{ secrets.PLAID_SECRET }}' >> .env &&
            echo 'REDIS_STORAGE_URI=${{ secrets.REDIS_STORAGE_URI }}' >> .env
          "

      # ---------------------------------------------------------
      # RELOAD PYTHONANYWHERE WEB APP
      # ---------------------------------------------------------
      - name: Reload PythonAnywhere web app
        if: github.ref == 'refs/heads/main'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PA_USER }}@ssh.pythonanywhere.com \
            "pa_reload_web_app ${{ secrets.PA_WEBAPP_NAME }}"
