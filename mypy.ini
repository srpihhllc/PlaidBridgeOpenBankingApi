# /home/srpihhllc/PlaidBridgeOpenBankingApi/mypy.ini

[mypy]
python_version = 3.12

# REMOVE these three — they cause the duplicate-module collision:
# packages = app
# explicit_package_bases = True
# namespace_packages = True

# Let mypy infer package bases normally (correct behavior for your repo)
follow_imports = normal

# Third‑party stubs: permissive migration mode
ignore_missing_imports = True

# Typing permissiveness for incremental adoption
allow_untyped_calls = True
allow_untyped_defs = True
check_untyped_defs = False

# Diagnostics
warn_unused_ignores = True
warn_return_any = True
show_error_codes = True
pretty = True

# Presentation
show_error_context = False
show_column_numbers = False

# Optional handling
no_implicit_optional = False
disallow_untyped_defs = False

# Per‑module overrides
[mypy-app.*]
ignore_missing_imports = True
allow_untyped_defs = True
allow_untyped_calls = True
check_untyped_defs = False
