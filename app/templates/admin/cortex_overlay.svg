<svg xmlns="http://www.w3.org/2000/svg" width="800" height="{{ 60 + (hits|length * 28) }}" viewBox="0 0 800 {{ 60 + (hits|length * 28) }}">

  <rect width="100%" height="100%" fill="#0f172a" rx="8"/>

  <text x="20" y="34" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">CORTEX ROUTE TELEMETRY OVERLAY ({{ hits|length }} endpoints)</text>

  {% for ep, count in hits.items() %}

  <g transform="translate(20, {{ 56 + loop.index0 * 28 }})">

    <text x="0" y="14" fill="#e2e8f0" font-family="monospace" font-size="12">{{ ep }}</text>

    <rect x="380" y="2" width="{{ [count * 4, 340]|min }}" height="14" fill="#22c55e" rx="3"/>

    <text x="735" y="14" fill="#94a3b8" font-family="monospace" font-size="12">{{ count }}</text>

  </g>

  {% endfor %}

</svg>

