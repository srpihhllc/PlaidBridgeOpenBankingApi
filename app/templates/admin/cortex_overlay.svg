<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    .bg { fill: #0f172a; }
    .header { fill: #38bdf8; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1px; rx: 6px; }
    .endpoint { fill: #f8fafc; font-family: monospace; font-size: 13px; }
    .badge { fill: #34d399; font-family: monospace; font-size: 12px; font-weight: bold; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="8" />
  <text x="20" y="35" class="header">Cortex Route Traffic Overlay</text>

  {% for endpoint, hit_count in hits.items() %}
    {% set y_pos = 55 + loop.index0 * 42 %}
    {% if y_pos < 560 %}
      <g transform="translate(20, {{ y_pos }})">
        <rect width="760" height="34" class="card" />
        <text x="15" y="22" class="endpoint">{{ endpoint }}</text>
        <text x="740" y="22" text-anchor="end" class="badge">{{ hit_count }} hits</text>
      </g>
    {% endif %}
  {% endfor %}
</svg>
