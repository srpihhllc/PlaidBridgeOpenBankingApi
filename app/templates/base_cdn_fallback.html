<!-- CDN fallback snippet for Bootstrap CSS and JS -->
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
<script>
  (function () {
    var href = "{{ url_for('static', filename='vendor/bootstrap.min.css') }}";
    var xhr = new XMLHttpRequest();
    xhr.open('HEAD', href, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && xhr.status === 404) {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css';
        document.head.appendChild(l);
      }
    };
    xhr.send(null);
  }());
</script>

<script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
<script>
  (function () {
    var src = "{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}";
    var xhr = new XMLHttpRequest();
    xhr.open('HEAD', src, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && xhr.status === 404) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js';
        document.head.appendChild(s);
      }
    };
    xhr.send(null);
  }());
</script>
